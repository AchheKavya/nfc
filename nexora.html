<title>VR'S NEXORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   VR'S NEXORA — design system
   Deliberate single visual world: a premium light SaaS surface
   (ivory/white) with fixed obsidian-navy accent panels and a
   controlled purple/gold accent. This is a fixed brand identity
   (like a real product's marketing + admin surface), so colors
   are painted explicitly and do not react to viewer OS theme.
   ============================================================ */
:root{
  color-scheme: light;
  --obsidian:#090B10; --navy:#0B1028; --navy-2:#151B3A; --navy-3:#1C2350;
  --purple:#5B35D5; --purple-dark:#4A2BB8; --purple-soft:#EFE9FC;
  --blue:#4D7CFF; --blue-soft:#EAF0FF;
  --lavender:#F2EFFF; --ivory:#F7F5EF; --white:#FFFFFF;
  --ink:#151827; --ink-soft:#777C90; --ink-faint:#A6A9B8;
  --border:#E7E8F0; --border-soft:#F0F1F6;
  --success:#18A673; --success-soft:#E7F7F1;
  --danger:#E45868; --danger-soft:#FCEAEC;
  --warning:#C98A1F; --warning-soft:#FBF1DF;
  --gold:#C9A96E; --gold-soft:#F6EFE1; --gold-line:#E4D3AE;
  --bg-page:var(--ivory); --bg-surface:var(--white); --bg-sunken:#FBFAF6;
  --shadow-sm:0 2px 10px rgba(20,20,50,.05);
  --shadow-md:0 12px 35px rgba(20,20,50,.07);
  --shadow-lg:0 24px 60px rgba(9,11,16,.18);
  --shadow-navy:0 20px 50px rgba(9,11,16,.35);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
  --font-display:'Manrope',Inter,-apple-system,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --header-h:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--font-display);font-weight:800;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
/* Internal SPA navigation is rendered as <button data-nav="..."> (never <a href>)
   so the artifact host never intercepts it as an external link. This reset strips
   default button chrome; it never sets `display`, so whichever component class
   is paired with it (.btn, .side-link, .brand, .pub-links a rules below, etc.)
   still controls layout via normal source-order cascade. */
.nav-link{background:none;border:none;margin:0;padding:0;font:inherit;color:inherit;text-align:inherit;text-decoration:none;-webkit-appearance:none;appearance:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%;display:block}
svg{display:block}
::selection{background:var(--purple);color:#fff}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

/* ---------- layout ---------- */
.container{max-width:1240px;margin:0 auto;padding:0 28px}
.section{padding:96px 0}
.section-tight{padding:56px 0}
@media (max-width:768px){.section{padding:64px 0}.section-tight{padding:40px 0}.container{padding:0 20px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);background:var(--purple-soft);padding:7px 14px;border-radius:var(--r-pill)}
.eyebrow.on-dark{color:var(--blue);background:rgba(77,124,255,.14)}
.section-head{max-width:640px;margin:0 auto 48px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.section-head h2{font-size:clamp(28px,4vw,40px)}
.section-head p{color:var(--ink-soft);font-size:16px;line-height:1.7}
.grid{display:grid;gap:24px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr}}
.flex{display:flex}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column}
.muted{color:var(--ink-soft)}
.center{text-align:center}
.mono{font-family:var(--font-mono)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:14.5px;border-radius:var(--r-sm);padding:13px 24px;border:1px solid transparent;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap;line-height:1}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--purple);color:#fff;box-shadow:0 10px 24px rgba(91,53,213,.28)}
.btn-primary:hover{background:var(--purple-dark);box-shadow:0 14px 30px rgba(91,53,213,.34)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--obsidian)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--ink)}
.btn-outline:hover{border-color:var(--purple);color:var(--purple)}
.btn-outline.on-dark{border-color:rgba(255,255,255,.25);color:#fff}
.btn-outline.on-dark:hover{border-color:#fff}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-ghost:hover{color:var(--ink);background:var(--bg-sunken)}
.btn-gold{background:linear-gradient(180deg,#D8BC87,var(--gold));color:#3A2E15}
.btn-danger-ghost{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:9px}
.btn-lg{padding:16px 30px;font-size:15.5px;border-radius:12px}
.btn-block{width:100%}
.btn-icon{padding:10px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
@keyframes btnSpin{to{transform:rotate(360deg)}}
.btn-spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:btnSpin .65s linear infinite;vertical-align:-3px;margin-right:2px}
.btn-outline .btn-spinner,.btn-ghost .btn-spinner{border-color:var(--border);border-top-color:var(--purple)}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--purple)}
.link-arrow svg{transition:transform .15s}
.link-arrow:hover svg{transform:translateX(3px)}

/* ---------- badges / status ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);letter-spacing:.02em}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-purple{background:var(--purple-soft);color:var(--purple-dark)}
.badge-gold{background:var(--gold-soft);color:#8A6D33;border:1px solid var(--gold-line)}
.badge-success{background:var(--success-soft);color:#0E7A57}
.badge-danger{background:var(--danger-soft);color:#C13048}
.badge-warning{background:var(--warning-soft);color:#8A611A}
.badge-neutral{background:var(--bg-sunken);color:var(--ink-soft);border:1px solid var(--border)}
.badge-blue{background:var(--blue-soft);color:#3159C9}

/* ---------- surfaces / cards ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:26px}
.panel-navy{background:radial-gradient(120% 140% at 15% 0%,var(--navy-3),var(--navy) 55%,var(--obsidian));color:#fff;border-radius:var(--r-xl)}
.hairline{border:1px solid var(--border)}
.divider{height:1px;background:var(--border);border:0;margin:0}

/* ---------- top public nav ---------- */
.pub-nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft)}
.pub-nav .container{height:var(--header-h);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--navy-2),var(--obsidian));display:flex;align-items:center;justify-content:center;color:var(--blue);font-family:var(--font-display);font-weight:800;font-size:16px;flex:none}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:9.5px;letter-spacing:.16em;color:var(--gold);margin-top:1px}
.pub-links{display:flex;align-items:center;gap:34px;font-size:14px;font-weight:600;color:var(--ink)}
.pub-links a,.pub-links .nav-link{color:var(--ink-soft);transition:color .15s}
.pub-links a:hover,.pub-links a.active,.pub-links .nav-link:hover,.pub-links .nav-link.active{color:var(--purple)}
.pub-actions{display:flex;align-items:center;gap:12px}
.hamburger{display:none;flex-direction:column;gap:4px;background:none;border:0;padding:8px}
.hamburger span{width:20px;height:2px;background:var(--ink);border-radius:2px}
.mobile-menu{display:none;flex-direction:column;gap:2px;padding:10px 20px 22px;border-bottom:1px solid var(--border-soft);background:#fff}
.mobile-menu a,.mobile-menu .nav-link{display:block;width:100%;padding:12px 4px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--border-soft)}
@media (max-width:900px){.pub-links{display:none}.pub-actions .btn-outline{display:none}.hamburger{display:flex}}

/* ---------- footer ---------- */
.pub-footer{background:var(--obsidian);color:rgba(255,255,255,.7);padding:64px 0 28px}
.pub-footer h5{color:#fff;font-family:var(--font-body);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.pub-footer a,.pub-footer .nav-link{color:rgba(255,255,255,.62);font-size:14px;display:block;width:100%;padding:6px 0;transition:color .15s}
.pub-footer a:hover,.pub-footer .nav-link:hover{color:#fff}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.2fr;gap:32px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.09)}
@media (max-width:900px){.foot-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.foot-grid{grid-template-columns:1fr}}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-size:13px;color:rgba(255,255,255,.45)}
@media (max-width:640px){.foot-bottom{flex-direction:column;gap:10px;text-align:center}}

/* ---------- hero ---------- */
.hero{padding:64px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr;text-align:center}.hero-visual{margin:0 auto}.trust-row{justify-content:center}.hero-actions{justify-content:center}}
.hero h1{font-size:clamp(40px,5.6vw,68px);line-height:.98;letter-spacing:-.03em}
.hero-sub{color:var(--ink-soft);font-size:17.5px;line-height:1.7;max-width:480px;margin-top:20px}
.hero-actions{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.trust-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.trust-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--bg-surface);border:1px solid var(--border);padding:8px 13px 8px 10px;border-radius:var(--r-pill)}
.trust-chip svg{color:var(--purple)}

/* NFC identity card visual */
.hero-visual{position:relative;width:100%;max-width:420px;height:420px;display:flex;align-items:center;justify-content:center}
.wave-ring{position:absolute;border-radius:50%;border:1px solid rgba(77,124,255,.35);animation:waveOut 4.2s ease-out infinite}
.wave-ring.r2{animation-delay:1.4s}.wave-ring.r3{animation-delay:2.8s}
@keyframes waveOut{0%{width:220px;height:220px;opacity:.55}100%{width:460px;height:460px;opacity:0}}
.nfc-card{position:relative;width:340px;height:214px;border-radius:22px;background:
    radial-gradient(120% 160% at 12% 0%,#2A2F45,var(--navy) 46%,var(--obsidian) 100%);
  box-shadow:0 40px 70px -18px rgba(9,11,16,.55),inset 0 1px 0 rgba(255,255,255,.08);
  animation:cardFloat 6s ease-in-out infinite;overflow:hidden;padding:26px 28px;color:#fff}
.nfc-card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 40%);pointer-events:none}
.nfc-card::after{content:"";position:absolute;width:180px;height:180px;right:-70px;bottom:-90px;background:radial-gradient(circle,rgba(91,53,213,.5),transparent 70%);filter:blur(6px)}
@keyframes cardFloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(.4deg)}}
.nfc-card .row-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.nfc-card .brandmini{font-family:var(--font-display);font-weight:800;font-size:12.5px;letter-spacing:.06em;color:rgba(255,255,255,.85)}
.nfc-card .brandmini span{display:block;font-family:var(--font-body);font-weight:600;font-size:8px;letter-spacing:.18em;color:var(--gold);margin-top:2px}
.nfc-signal{color:var(--blue)}
.nfc-card .idmark{position:relative;z-index:2;font-family:var(--font-display);font-weight:800;font-size:56px;letter-spacing:-.03em;margin-top:22px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nfc-card .row-bot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.nfc-card .serial{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.55)}
.nfc-card .chip-word{font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase}
.nfc-card.small{width:220px;height:138px;padding:18px 20px;border-radius:16px}
.nfc-card.small .idmark{font-size:34px;margin-top:14px}
.nfc-card.small .serial{font-size:9px}
.nfc-card.tiny{width:150px;height:94px;padding:13px 14px;border-radius:12px}
.nfc-card.tiny .idmark{font-size:24px;margin-top:8px}
.nfc-card.tiny .brandmini{font-size:9px}
.nfc-card.tiny .serial{font-size:7.5px}
.nfc-card.blocked{filter:grayscale(.6) brightness(.75)}
.nfc-card.c-white{background:radial-gradient(120% 160% at 12% 0%,#fff,#F2EFEA 55%,#E8E4DA 100%);color:#151827}
.nfc-card.c-white .idmark{background:linear-gradient(180deg,#151827,rgba(21,24,39,.5));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nfc-card.c-white .brandmini{color:rgba(21,24,39,.8)}
.nfc-card.c-white .brandmini span{color:#8A6D33}
.nfc-card.c-white .serial{color:rgba(21,24,39,.5)}
.nfc-card.c-white .chip-word{color:rgba(21,24,39,.42)}
.nfc-card.c-white .nfc-signal{color:var(--purple)}
.nfc-card.c-white::after{background:radial-gradient(circle,rgba(77,124,255,.25),transparent 70%)}
.nfc-card.c-blue{background:radial-gradient(120% 160% at 12% 0%,#3E5DE0,var(--blue) 55%,#26399C 100%)}
.nfc-card.c-custom{background:radial-gradient(120% 160% at 12% 0%,#4A3B22,var(--gold) 55%,#3A2E15 100%)}

/* shop selectors */
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.type-card{border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;background:#fff}
.type-card:hover{border-color:var(--purple)}
.type-card.active{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
.type-card b{font-size:14px}
.type-card .p{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:block}
.type-card .amt{font-family:var(--font-display);font-weight:800;margin-top:8px;display:block}
.swatch-row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:var(--r-pill);border:1.5px solid var(--border);cursor:pointer;font-size:13px;font-weight:600}
.swatch.active{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-dark)}
.swatch i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}
.qty-stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.qty-stepper button{width:38px;height:38px;background:var(--bg-sunken);font-weight:700;font-size:16px;color:var(--ink)}
.qty-stepper span{width:40px;text-align:center;font-weight:700}
.cart-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:0}
.mini-card-thumb{width:64px;height:40px;border-radius:8px;background:radial-gradient(120% 160% at 12% 0%,#2A2F45,var(--navy) 46%,var(--obsidian) 100%)}

/* ---------- feature / info cards ---------- */
.feature-card{padding:28px;border-radius:var(--r-lg);background:var(--bg-surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s,transform .2s}
.feature-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.icon-tile{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--purple-soft);color:var(--purple)}
.icon-tile.blue{background:var(--blue-soft);color:var(--blue)}
.icon-tile.gold{background:var(--gold-soft);color:#8A6D33}
.icon-tile.navy{background:var(--navy);color:var(--blue)}
.feature-card h4{font-size:17px}
.feature-card p{color:var(--ink-soft);font-size:14.5px;line-height:1.65}

/* steps / how it works */
.step-row{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
@media (max-width:980px){.step-row{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.step-row{grid-template-columns:1fr}}
.step{position:relative;padding:24px 20px;border-radius:var(--r-lg);background:var(--bg-surface);border:1px solid var(--border)}
.step .num{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--purple);background:var(--purple-soft);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.step h5{font-size:15px;margin-bottom:6px}
.step p{font-size:13.5px;color:var(--ink-soft);line-height:1.6}

/* pricing */
.price-card{padding:32px 28px;border-radius:var(--r-xl);background:var(--bg-surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:18px;position:relative}
.price-card.featured{background:radial-gradient(140% 120% at 20% 0%,var(--navy-3),var(--navy) 60%,var(--obsidian));color:#fff;border-color:transparent;box-shadow:var(--shadow-navy);transform:scale(1.03)}
.price-card.featured .muted{color:rgba(255,255,255,.6)}
.price-card.featured .price-feat li{color:rgba(255,255,255,.85)}
.price-card .tag-pop{position:absolute;top:-13px;right:24px;background:var(--gold);color:#3A2E15;font-size:11px;font-weight:800;padding:5px 12px;border-radius:var(--r-pill);letter-spacing:.04em}
.price-amt{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.02em}
.price-amt span{font-size:14px;font-weight:600;color:var(--ink-soft)}
.price-card.featured .price-amt span{color:rgba(255,255,255,.6)}
.price-feat{display:flex;flex-direction:column;gap:11px}
.price-feat li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.price-feat svg{flex:none;color:var(--success);margin-top:2px}
.price-card.featured .price-feat svg{color:var(--blue)}

/* accordion / faq */
.accordion-item{border-bottom:1px solid var(--border)}
.accordion-item:first-child{border-top:1px solid var(--border)}
.accordion-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 4px;background:none;border:0;text-align:left;font-family:var(--font-body);font-weight:700;font-size:15.5px;color:var(--ink)}
.accordion-btn svg{flex:none;transition:transform .2s;color:var(--ink-soft)}
.accordion-item.open .accordion-btn svg{transform:rotate(45deg);color:var(--purple)}
.accordion-panel{max-height:0;overflow:hidden;transition:max-height .25s ease}
.accordion-item.open .accordion-panel{max-height:340px}
.accordion-panel p{padding:0 4px 20px;color:var(--ink-soft);font-size:14.5px;line-height:1.7;max-width:640px}

/* final CTA */

// deterministic pseudo-random series generator (no Math.random — stable renders)
NX.genSeries = function(days, base, variance, seed){
  const out = []; let s = seed;
  for (let i = 0; i < days; i++){
    s = (s * 9301 + 49297) % 233280;
    const rnd = s / 233280;
    const wave = Math.sin(i / 4.2) * variance * 0.5;
    out.push(Math.max(0, Math.round(base + wave + (rnd - 0.5) * variance)));
  }
  return out;
};

  for (let i = 29; i >= 0; i--){ const d = new Date(end); d.setDate(d.getDate() - i); out.push(d); }
  return out;
};

// ---- nav ----
// SPA router: state/history-based, never assigns location.hash directly (that
// triggers the artifact host's "open external link" interception on some
// embeds). NX.state.currentPath is the single source of truth for NX.render().
NX.navigate = function(path){
  const clean = String(path || "/").replace(/^#/, "");
  const normalized = clean.indexOf("/") === 0 ? clean : "/" + clean;
  if (NX.state.currentPath !== normalized){
    NX.state.currentPath = normalized;
    try { history.pushState({ path: normalized }, "", "#" + normalized); } catch(err){}
  }
  NX.render();
  window.scrollTo({top:0,behavior:"instant"});
};

NX.icon = function(name, size, sw){

};

// ---- NFC identity card (component spec §52) ----
NX.C.nfcCard = function(opts){
  opts = opts || {};
  const size = opts.size || "lg"; // lg | md | sm | tiny
  const cls = size === "lg" ? "" : size === "md" ? "" : size === "sm" ? "small" : "tiny";
  const serial = opts.serial || "NX-NFC-000000";
  const blockedCls = opts.blocked ? " blocked" : "";
  return `
  <div class="nfc-card ${cls}${blockedCls}">
    <div class="row-top">
      <div class="brandmini">VR'S NEXORA<span>DIGITAL IDENTITY</span></div>
      <span class="nfc-signal">${NX.icon("wave", size==='lg'?22:size==='sm'?17:13, 1.9)}</span>
    </div>
    <div class="idmark">N</div>
    <div class="row-bot">
      <span class="serial">${NX.esc(serial)}</span>
      <span class="chip-word">${opts.blocked ? "Blocked" : "Tap to Connect"}</span>
    </div>
  </div>`;
};

NX.C.statCard = function(o){
  const dir = o.trend >= 0 ? "up" : "down";
  const arrow = o.trend >= 0 ? "▲" : "▼";
  return `
  <div class="stat-card">
    <div class="stat-top">
      <span class="stat-label">${NX.esc(o.label)}</span>
      <span class="stat-icon">${NX.icon(o.icon,18,1.9)}</span>
    </div>
    <span class="stat-value tabular">${o.value}</span>
    ${o.trend != null ? `<span class="stat-trend ${dir}">${arrow} ${Math.abs(o.trend)}% ${NX.esc(o.trendLabel||"this week")}</span>` : `<span class="muted" style="font-size:12.5px">${NX.esc(o.sub||"")}</span>`}
  </div>`;
};

NX.C.emptyState = function(o){
  return `
  <div class="empty-state">
    <span class="icon-tile">${NX.icon(o.icon||"box",24,1.7)}</span>
    <h4>${NX.esc(o.title)}</h4>
    <p style="max-width:320px;font-size:13.5px">${NX.esc(o.desc||"")}</p>
    ${o.actionLabel ? `<button type="button" class="btn btn-primary btn-sm mt-8 nav-link" data-nav="${(o.actionHash||'').replace(/^#/,'')}">${NX.esc(o.actionLabel)}</button>` : ""}
  </div>`;
};

NX.C.pagination = function(page, totalPages, actionName){
  if (totalPages <= 1) return "";
  let btns = "";
  for (let i = 1; i <= totalPages; i++){
    btns += `<button class="pg-btn ${i===page?'active':''}" data-action="${actionName}" data-page="${i}">${i}</button>`;
  }
  return `
  <div class="pagination">
    <span>Page ${page} of ${totalPages}</span>
    <div class="pg-btns">
      <button class="pg-btn" data-action="${actionName}" data-page="${Math.max(1,page-1)}">${NX.icon("chevronLeft",14,2.2)}</button>
      ${btns}
      <button class="pg-btn" data-action="${actionName}" data-page="${Math.min(totalPages,page+1)}">${NX.icon("chevronRight",14,2.2)}</button>
    </div>
  </div>`;
};

NX.C.accordionItem = function(q,a,idx){
  const open = NX.state.activeAccordion === idx;
  return `
  <div class="accordion-item ${open?'open':''}">
    <button class="accordion-btn" data-action="toggleAccordion" data-idx="${idx}">
      <span>${NX.esc(q)}</span>${NX.icon("plus",18,2.2)}
    </button>
    <div class="accordion-panel"><p>${NX.esc(a)}</p></div>
  </div>`;
};

// ===== CHARTS =====
// Hand-built inline SVG charts (no charting library). Fixed light chart surface,
// single-theme by design (see CSS header note). Colors: sequential = brand purple;
// two-series comparison = purple/gold (an analogous pairing to a validated blue/
// orange categorical pair); status colors are never reused as series colors.
NX._chartData = {};

NX.C.lineChartMulti = function(id, dates, series, opts){
  opts = opts || {};
  const W = 640, H = 230, padL = 10, padR = 10, padT = 20, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(...allVals, 1) * 1.12;
  const n = dates.length;
  const stepX = plotW / (n - 1);
  const toPts = vals => vals.map((v,i) => [padL + i*stepX, padT + plotH - (v/max)*plotH]);
  const seriesPts = series.map(s => ({ ...s, pts: toPts(s.values) }));

  const grid = [0.25,0.5,0.75,1].map(f => {
    const y = padT + plotH - f*plotH;
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#EDEEF4" stroke-width="1"/>
      <text x="${padL}" y="${y-5}" font-size="10" fill="#9A9DAE" font-family="Inter">${Math.round(max*f)}</text>`;
  }).join("");

  const areas = seriesPts.map((s,si) => {
    const d = "M" + s.pts.map(p=>p.join(",")).join(" L");
    const areaD = d + ` L${s.pts[s.pts.length-1][0]},${padT+plotH} L${s.pts[0][0]},${padT+plotH} Z`;
    const fillOpacity = si === 0 ? 0.16 : 0.10;
    return si === 0 ? `<path d="${areaD}" fill="${s.color}" opacity="${fillOpacity}"/>` : "";
  }).join("");
  const lines = seriesPts.map(s => `<path d="M${s.pts.map(p=>p.join(",")).join(" L")}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const endDots = seriesPts.map(s => {
    const [ex,ey] = s.pts[s.pts.length-1];
    return `<circle cx="${ex}" cy="${ey}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
  }).join("");

  const xLabels = [0, Math.floor((n-1)/2), n-1].map(i => `<text x="${padL+i*stepX}" y="${H-8}" font-size="10" fill="#9A9DAE" font-family="Inter" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${dates[i]}</text>`).join("");

  const crosshair = `<g id="cross_${id}" style="display:none">
      <line x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="#C9CBDA" stroke-width="1" stroke-dasharray="3,3"/>
      ${seriesPts.map((s,si) => `<circle id="dot_${id}_${si}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join("")}
    </g>`;

  NX._chartData[id] = { dates, series: seriesPts.map(s=>({name:s.name,color:s.color,values:s.values})), W,H,padL,plotW,n,unit: opts.unit||"" };

  const legend = series.length > 1 ? `<div class="chart-legend mt-12">${series.map(s=>`<span class="legend-item"><i class="legend-swatch" style="background:${s.color}"></i>${NX.esc(s.name)}</span>`).join("")}</div>` : "";

  return `
  <div class="chart-wrap" id="wrapmulti_${id}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${opts.height||220}" onmousemove="NX.chartMoveMulti(event,'${id}')" onmouseleave="NX.chartLeave('${id}')">
      ${grid}${areas}${lines}${endDots}${xLabels}${crosshair}
    </svg>
    <div class="chart-tip" id="tip_${id}"></div>
  </div>${legend}`;
};

NX.C.lineChart = function(id, dates, values, opts){
  opts = opts || {};
  return NX.C.lineChartMulti(id, dates, [{ name: opts.name||"Taps", values, color: opts.color||"#5B35D5" }], opts);
};

NX.chartMoveMulti = function(evt, id){
  const d = NX._chartData[id]; if(!d) return;
  const rect = evt.currentTarget.getBoundingClientRect();
  const scaleX = d.W / rect.width;
  const mx = (evt.clientX - rect.left) * scaleX;
  const stepX = d.plotW / (d.n - 1);
  let idx = Math.round((mx - d.padL) / stepX);
  idx = NX.clamp(idx, 0, d.n - 1);
  const x = d.padL + idx*stepX;
  const cross = document.getElementById("cross_"+id);
  if (cross){
    cross.style.display = "block";
    cross.setAttribute("transform", `translate(${x},0)`);
    const padT = 20, plotH = d.H - 20 - 30, max = Math.max(...d.series.flatMap(s=>s.values),1)*1.12;
    d.series.forEach((s,si) => {
      const y = padT + plotH - (s.values[idx]/max)*plotH;
      const dot = document.getElementById(`dot_${id}_${si}`);
      if (dot) dot.setAttribute("cy", y);
    });
  }
  const tip = document.getElementById("tip_"+id);
  if (tip){
    const rows = d.series.map(s => `<b style="color:${s.color}">${s.values[idx]}${d.unit}</b> ${NX.esc(s.name)}`).join(" &nbsp;·&nbsp; ");
    tip.innerHTML = `${rows}<br><span style="opacity:.6">${d.dates[idx]}</span>`;
    tip.style.left = (x/d.W*100) + "%";
    tip.style.top = "8%";
    tip.classList.add("show");
  }
};
NX.chartLeave = function(id){
  const cross = document.getElementById("cross_"+id); if (cross) cross.style.display = "none";
  const tip = document.getElementById("tip_"+id); if (tip) tip.classList.remove("show");
};

NX.C.barList = function(items, opts){
  opts = opts || {};
  const max = Math.max(...items.map(i=>i.pct), 1);
  const color = opts.color || "#5B35D5";
  return `<div>${items.map(i => `
    <div class="bar-row">
      <span class="bar-label">${NX.esc(i.name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(i.pct/max*100).toFixed(0)}%;background:${color}"></span></span>
      <span class="bar-val tabular">${i.pct}%</span>
    </div>`).join("")}</div>`;
};

NX.C.stackedBar = function(items, colors){
  const total = items.reduce((s,i)=>s+i.pct,0) || 1;
  let x = 0;
  const segs = items.map((it,i) => {
    const w = (it.pct/total*100);
    const seg = `<div style="position:absolute;left:${x}%;top:0;bottom:0;width:${w}%;background:${colors[i%colors.length]};border-right:2px solid #fff"></div>`;
    x += w; return seg;
  }).join("");
  const legend = items.map((it,i) => `<span class="legend-item"><i class="legend-swatch" style="background:${colors[i%colors.length]}"></i>${NX.esc(it.name)} · ${it.pct}%</span>`).join("");
  return `<div style="position:relative;height:14px;border-radius:8px;overflow:hidden;background:var(--bg-sunken)">${segs}</div><div class="chart-legend mt-16">${legend}</div>`;
};

  }
  if (card.status === "BLOCKED"){
    return NX.publicPage("#/", `<section class="section"><div class="container" style="max-width:480px">${NX.C.emptyState({icon:"lock",title:"This NFC card has been blocked",desc:"Contact VR'S NEXORA support if you believe this is a mistake.",actionLabel:"Contact Support",actionHash:"#/contact"})}</div></section>`);

  if (card.status === "ACTIVE" && card.customerId){

    ${NX.C.emptyState({icon:"nfc",title:"NFC Card Not Activated",desc:"This card is mapped but hasn't been activated by its owner yet.",actionLabel:"Activate This Card",actionHash:"#/activate/"+encodeURIComponent(serial)})}

NX.fakeQr = function(text, size){
  // Deterministic decorative fallback pattern (not scannable) used only if the
  // QR library fails to load — keeps the layout looking correct either way.
  const n = 21; let seed = 0;
  for (let i = 0; i < text.length; i++) seed = (seed * 31 + text.charCodeAt(i)) >>> 0;
  const cell = size / n;
  let rects = "";
  const isFinder = (r,c) => (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  for (let r = 0; r < n; r++){
    for (let cIdx = 0; cIdx < n; cIdx++){
      if (isFinder(r,cIdx)) continue;
      seed = (seed * 1103515245 + 12345) >>> 0;
      if ((seed >>> 16) % 100 < 46) rects += `<rect x="${cIdx*cell}" y="${r*cell}" width="${cell}" height="${cell}"/>`;
    }
  }
  const finder = (x,y) => `<g transform="translate(${x},${y})"><rect width="${cell*7}" height="${cell*7}" fill="#151827"/><rect x="${cell}" y="${cell}" width="${cell*5}" height="${cell*5}" fill="#fff"/><rect x="${cell*2}" y="${cell*2}" width="${cell*3}" height="${cell*3}" fill="#151827"/></g>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#151827">${rects}${finder(0,0)}${finder((n-7)*cell,0)}${finder(0,(n-7)*cell)}</svg>`;
};

NX.searchInput = function(placeholder, key){
  const val = (NX.state.search && NX.state.search[key]) || "";
  return `<div class="topbar-search" style="width:250px">${NX.icon("search",15,2)}<input placeholder="${NX.esc(placeholder)}" value="${NX.esc(val)}" data-preserve="${key}" data-input-action="setSearch" data-key="${key}"></div>`;
};
NX.matchSearch = function(term, fields){
  if (!term) return true;
  term = term.toLowerCase();
  return fields.some(f => String(f||"").toLowerCase().indexOf(term) !== -1);
};

// ---- auth ----
NX.actions.login = function(e, el){
  e.preventDefault();
  if (NX.state.loginLoading) return false; // ignore a double-submit while a login is already in flight
  const form = el.form;
  const email = form.email.value.trim().toLowerCase(), pw = form.password.value;
  NX.state.loginEmailDraft = form.email.value;
  if (!email || !pw){
    NX.state.loginError = !email && !pw ? "Enter your email and password" : !email ? "Enter your email" : "Enter your password";
    NX.render();
    return false;
  }
  // Brief simulated loading state (this is a static prototype — there's no
  // real network round trip) so the button visibly shows work is happening,
  // per the "proper loading state while login is processing" requirement.
  NX.state.loginLoading = true;
  NX.state.loginError = "";
  NX.render();
  setTimeout(function(){
    NX.state.loginLoading = false;
    const ca = NX.demoAccounts.customer, aa = NX.demoAccounts.admin;
    if (email === ca.email && pw === ca.password){
      const cust = NX.getCustomer(ca.customerId);
      NX.state.session = { role:"customer", customerId:ca.customerId, name:cust.name, email:ca.email };
      NX.state.loginError = ""; NX.state.loginEmailDraft = "";
      NX.toast("Welcome back, " + cust.name.split(" ")[0] + "!");
      NX.navigate("#/app/dashboard");
    } else if (email === aa.email && pw === aa.password){
      NX.state.session = { role:"admin", name:"Admin User", email:aa.email };
      NX.state.loginError = ""; NX.state.loginEmailDraft = "";
      NX.toast("Welcome back, Admin");
      NX.navigate("#/admin/dashboard");
    } else {
      NX.state.loginError = "Invalid email or password";
      NX.render();
    }
  }, 550);
  return false;
};
NX.actions.logout = function(e){ if(e) e.preventDefault(); NX.state.session = null; NX.state.loginError = ""; NX.state.loginEmailDraft = ""; NX.state.loginLoading = false; NX.toast("Logged out"); NX.navigate("#/"); return false; };

NX.checkStrength = function(el){
  const v = el.value; let score = 0;
  if (v.length >= 8) score++; if (/[A-Z]/.test(v)) score++; if (/[0-9]/.test(v)) score++; if (/[^A-Za-z0-9]/.test(v)) score++;
  const bar = document.getElementById("strengthBar"); if (!bar) return;
  const colors = ["#E45868","#E45868","#C98A1F","#18A673","#18A673"];
  [...bar.children].forEach((s,i) => { s.style.background = i < score ? colors[score] : "var(--border)"; });
};

  if (card.status !== "INACTIVE"){ NX.toast("This card isn't ready to activate yet", "error"); return false; }

  NX.toast("Card activated! Opening your profile...");

};

};

NX.render = function(){
  let active = document.activeElement, focusInfo = null;
  if (active && active.getAttribute && active.getAttribute("data-preserve")){
    focusInfo = { key:active.getAttribute("data-preserve"), start:active.selectionStart, end:active.selectionEnd };
  }
  const path = NX.state.currentPath || "/";
  let matched = null, params = null;
  for (const r of NX.ROUTES){ const m = path.match(r.path); if (m){ matched = r; params = m; break; } }

  if (matched && matched.guard && (!NX.state.session || NX.state.session.role !== matched.guard)){
    if (!NX.state.session){
      // not logged in at all — send to login
      NX.navigate("/login");
    } else {
      // logged in, but the wrong role for this module (e.g. a customer
      // hitting an /admin/* route) — access denied, back to their own
      // dashboard, never to another role's protected pages.
      NX.toast("Access denied — you don't have permission to view that page", "error");
      NX.navigate(NX.state.session.role === "admin" ? "/admin/dashboard" : "/app/dashboard");
    }
    return;
  }
  NX._postRender = null;
  const html = matched ? matched.view(params) : NX.V.notFound();
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0,0);
  if (NX._postRender){ const fn = NX._postRender; NX._postRender = null; fn(); }
  if (focusInfo){
    const el = document.querySelector(`[data-preserve="${focusInfo.key}"]`);
    if (el){ el.focus(); try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(err){} }
  }
};

// ===== INIT =====
//
// Every "form" in this app (login included) is submitted WITHOUT ever
// relying on the browser's native form-submission mechanism. Two independent
// hosting-sandbox restrictions can silently break that mechanism, and this
// app can't know in advance which (if either) applies to the page it ends up
// embedded in:
//   1. Inline on*="..." HTML attributes can be refused by a strict CSP
//      (script-src without 'unsafe-inline'/'unsafe-hashes') even though this
//      <script> block itself runs fine — already fixed by moving every
//      handler to data-* + addEventListener.
//   2. A sandboxed iframe without the `allow-forms` token sets the "sandboxed
//      forms browsing context flag", which makes the browser abort the whole
//      form-submission algorithm *before* it ever dispatches a "submit"
//      event — so even a correctly-wired addEventListener("submit", ...)
//      never fires, no matter how it's attached. Neither clicking a
//      type="submit" button nor pressing Enter can trigger it.
// (2) is why login could still look broken after (1) was fixed: the sidebar
// (plain buttons, no <form>) started working, but every <form> — login,
// contact, checkout, signup, etc. — kept silently doing nothing.
// The fix: submit buttons are type="button" data-action="X" (a plain click,
// which we already know works), matched to their <form data-form="X">. The
// click handler below finds that form via the button's own .form property,
// runs the browser's native constraint validation on it with
// reportValidity() (this is a Constraint Validation API call, independent of
// actual submission, so it isn't blocked by sandboxed-forms — it still pops
// the familiar "Please fill out this field" bubble), and only then calls the
// matching NX.actions.* handler, which reads its fields via el.form.email /
// el.form.password / etc. (el.form works from any button — click OR the
// synthetic click the keydown handler below fires for Enter).
document.addEventListener("click", function(e){
  // data-action handlers run first (e.g. closeModal, logout's own internal
  // navigate); data-nav then performs SPA navigation. Elements can carry
  // both (e.g. the sidebar logout button, or a "close + go" button) — both
  // fire safely since NX.navigate() is a no-op re-render when already there.
  const actionEl = e.target.closest("[data-action]");
  if (actionEl){
    const ownerForm = actionEl.form;
    const isFormSubmitAction = ownerForm && ownerForm.getAttribute("data-form") === actionEl.getAttribute("data-action");
    if (isFormSubmitAction && !ownerForm.reportValidity()) return; // native "fill out this field" bubble, submission blocked
    const fn = NX.actions[actionEl.getAttribute("data-action")];
    if (typeof fn === "function") fn(e, actionEl);
  }
  const navEl = e.target.closest("[data-nav]");
  if (navEl) NX.navigate(navEl.getAttribute("data-nav"));
});
// Enter inside any form field submits that form — without relying on native
// implicit form submission (see the sandboxed-forms note above), by finding
// the form's own action button and reusing the exact click path above.
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  const field = e.target;
  if (!field || !field.closest || field.tagName === "TEXTAREA") return; // allow newlines in textareas
  const form = field.closest("form[data-form]");
  if (!form) return;
  const btn = form.querySelector('[data-action="' + form.getAttribute("data-form") + '"]');
  if (btn){ e.preventDefault(); btn.click(); }
});
// Defensive fallback only: with every submit button now type="button", the
// browser should never attempt native form submission at all — but if some
// embedding context somehow still does, don't let it navigate/reload.
document.addEventListener("submit", function(e){ e.preventDefault(); });
// <select onchange="...">-style dispatch, kept separate from data-action
// (click) so opening/clicking a <select> never spuriously re-fires a change
// handler with a stale value.
document.addEventListener("change", function(e){
  const el = e.target.closest && e.target.closest("[data-change-action]");
  if (!el) return;
  const fn = NX.actions[el.getAttribute("data-change-action")];
  if (typeof fn === "function") fn(e, el);
});
// oninput="..."-style dispatch: data-oninput calls a bare NX.* helper with the
// element itself (matches the old NX.otpAdvance(this)/NX.checkStrength(this)
// signature); data-input-action calls an NX.actions.* handler as (e, el).
document.addEventListener("input", function(e){
  const el = e.target;
  if (!el || !el.getAttribute) return;
  const helperName = el.getAttribute("data-oninput");
  if (helperName){ const fn = NX[helperName]; if (typeof fn === "function") fn(el); return; }
  const actionName = el.getAttribute("data-input-action");
  if (actionName){ const fn = NX.actions[actionName]; if (typeof fn === "function") fn(e, el); }
});
window.addEventListener("popstate", function(e){
  NX.state.sidebarOpen = false;
  NX.state.mobileMenuOpen = false;
  NX.state.currentPath = (e.state && e.state.path) || (location.hash ? location.hash.slice(1) : "/") || "/";
  NX.render();
});
// Initial path: honor a deep-linked location.hash on first load (e.g. a
// shared #/n/:serial or #/profile/:username link), then normalize the URL
// via replaceState so all further navigation flows through NX.navigate().
NX.state.currentPath = (location.hash ? location.hash.slice(1) : "/") || "/";
try { history.replaceState({ path: NX.state.currentPath }, "", "#" + NX.state.currentPath); } catch(err){}
NX.render();
</script>
